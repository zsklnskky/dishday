<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dishday - лист ожидания. Ужин решён.</title>
<meta name="description" content="Dishday: меню ужинов на неделю, список покупок и цены пяти сетей Беларуси. Запуск 1 октября 2026, первые 150 из листа ожидания входят бесплатно.">
<meta name="theme-color" content="#05070F">
<meta property="og:title" content="Dishday. Ужин решён.">
<meta property="og:description" content="Запуск 1 октября. Первые 150 из листа ожидания входят бесплатно.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/1500/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236EE7F9'/%3E%3Cstop offset='1' stop-color='%238B7CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305070F'/%3E%3Cpath d='M10 45 A22 22 0 0 1 54 45' fill='none' stroke='%23F3F5FC' stroke-width='5.5' stroke-linecap='round'/%3E%3Cline x1='6' y1='51' x2='58' y2='51' stroke='%23F3F5FC' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='16.5' r='4.8' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#05070F; --bg1:#0B1020; --panel:rgba(18,24,44,.72);
  --a1:#6EE7F9; --a2:#8B7CF6; --a3:#F0A8D0; --good:#5EE3A1; --warn:#FF6B81;
  --grad:linear-gradient(110deg,#6EE7F9 0%,#8B7CF6 55%,#F0A8D0 100%);
  --ink:#F3F5FC; --ink2:#AEB8D6; --ink3:#8A94B4;
  --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.07);
  --stroke:rgba(170,190,255,.14); --stroke2:rgba(170,190,255,.26);
  --r-xl:28px; --r-l:18px; --r-m:18px; --r-s:12px;
  --ease:cubic-bezier(.16,1,.3,1); --spring:var(--ease); --smooth:var(--ease);
  --mp:#2a9fd0; --mf:#c77a2b; --mc:#8a6ddf;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg0); scroll-behavior:smooth; scroll-padding-top:90px}
body{margin:0; min-height:100dvh; color:var(--ink); overflow-x:hidden; background:var(--bg0);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
html.no-gl body{background:radial-gradient(900px 520px at 18% 12%,rgba(110,231,249,.10),transparent 60%),radial-gradient(800px 600px at 85% 30%,rgba(139,124,246,.12),transparent 60%),radial-gradient(700px 500px at 50% 100%,rgba(240,168,208,.08),transparent 60%),var(--bg0) fixed}
h1,h2,h3,h4,.disp{font-family:"Unbounded",system-ui,sans-serif; font-weight:700; margin:0; letter-spacing:-.02em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0}
input{font:inherit; color:inherit}
a{color:var(--a1); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--a1); outline-offset:3px; border-radius:10px}
.num{font-variant-numeric:tabular-nums}
::selection{background:rgba(139,124,246,.5)}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* фон: «Полночная кухня» — WebGL-аврора, см. AURORA внизу страницы */
#aurora{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; display:block}
.stage{position:relative; z-index:2}
.wrap{max-width:1220px; margin:0 auto; padding-inline:22px}

.glass{background:var(--panel);
  border:1px solid var(--stroke); border-radius:var(--r-l);
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 30px 60px -32px rgba(1,3,12,.95)}
.grad-text{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.spot{position:relative}
.spot::after{content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none; opacity:0; transition:opacity .5s var(--ease);
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(110,231,249,.7),rgba(139,124,246,.35) 40%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.spot:hover::after{opacity:1}
@media (hover:none){ .spot::after{display:none} }

.btn{position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:14px 26px; border-radius:999px;
  font:700 16px Unbounded,sans-serif; transition:transform .45s var(--spring), box-shadow .3s, background .3s, opacity .3s; white-space:nowrap; text-decoration:none}
.btn::before{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%); transform:translateX(-120%); transition:transform .9s var(--smooth); pointer-events:none}
.btn:hover::before{transform:translateX(120%)}
.btn-main{color:#05070F; background:var(--grad); box-shadow:0 10px 34px -10px rgba(110,231,249,.7), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-main:hover{box-shadow:0 18px 50px -10px rgba(139,124,246,.85), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{color:var(--ink); background:var(--glass2); border:1px solid var(--stroke2)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn:active{transform:scale(.96)}
.btn[aria-busy="true"]{pointer-events:none; opacity:.8}
.btn .spin{width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(6,16,42,.25); border-top-color:#05070F; animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ico{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* шапка */
.top{position:sticky; top:12px; z-index:30; margin:12px auto 0; width:min(1220px,calc(100% - 28px)); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 8px 8px 18px; border-radius:999px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand svg{width:34px; height:34px; flex:none}
.wm{font:800 23px/1 Unbounded,sans-serif; letter-spacing:-.03em}
.wm .i{position:relative}
.wm .i::after{content:""; position:absolute; left:50%; top:.02em; width:.22em; height:.22em; margin-left:-.11em; border-radius:50%; background:var(--grad)}
.top .right{display:flex; align-items:center; gap:8px}
.date-chip{display:inline-flex; align-items:center; gap:9px; height:46px; padding:0 16px; border-radius:999px; background:rgba(255,255,255,.07); border:1px solid var(--stroke); font-weight:700; font-size:14px; white-space:nowrap}
.pulse{width:9px; height:9px; border-radius:50%; background:var(--good); animation:pulse 2.2s infinite; flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,227,161,.7)} 70%{box-shadow:0 0 0 10px transparent} 100%{box-shadow:0 0 0 0 transparent}}
.lang-pill{flex:none; display:inline-flex; align-items:center; gap:2px; height:46px; padding:0 6px; border-radius:999px; background:var(--glass2); border:1px solid var(--stroke); font:800 12.5px Unbounded,sans-serif; letter-spacing:.04em; color:var(--ink3); transition:background .25s}
.lang-pill:hover{background:rgba(255,255,255,.16)}
.lang-pill b{font-weight:800; padding:6px 9px; border-radius:999px; transition:color .3s, background .3s}
.lang-pill b.on{color:#05070F; background:var(--grad)}
@media (max-width:640px){ .date-chip{display:none} .top{padding-left:14px} .lang-pill{height:42px} }

/* первый экран */
.hero{display:grid; grid-template-columns:minmax(0,1fr); gap:28px; padding-block:48px 40px; align-items:start}
@media (min-width:1000px){ .hero{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); gap:56px; padding-block:72px 64px; align-items:center} }
.kick{display:flex; align-items:center; gap:12px; font:700 13px Unbounded,sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.stack{display:flex}
.stack span{width:34px; height:34px; border-radius:50%; border:2px solid var(--bg1); background-size:cover; background-position:center; margin-left:-10px; box-shadow:0 6px 16px -6px rgba(0,0,0,.8)}
.stack span:first-child{margin-left:0}
h1.title{font-size:clamp(60px,9.4vw,128px); line-height:.92; font-weight:900; letter-spacing:-.05em; margin:22px 0 22px}
h1.title span{display:block}
.lead{font-size:clamp(17px,1.6vw,20px); color:var(--ink2); max-width:40ch}

.count{margin-top:30px; padding:22px 24px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; max-width:620px}
@media (min-width:560px){ .count{grid-template-columns:minmax(0,1fr) auto; align-items:end} }
.cap{font:700 12px Unbounded,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.bignum{display:flex; align-items:baseline; gap:12px; margin-top:6px; line-height:1}
.bignum b{font:900 clamp(64px,7vw,88px)/.9 Unbounded,sans-serif; letter-spacing:-.05em; display:inline-block}
.bignum b.bump{animation:bump .7s var(--spring)}
@keyframes bump{40%{transform:scale(1.14); color:var(--a1)}}
.bignum small{font:700 20px Unbounded,sans-serif; color:var(--ink3)}
.count .of{margin-top:6px; font-weight:700; color:var(--ink2)}
.bar{grid-column:1/-1; height:10px; border-radius:10px; background:rgba(255,255,255,.08); overflow:hidden}
.bar i{display:block; height:100%; width:0; border-radius:10px; background:linear-gradient(90deg,var(--a1),var(--a2)); box-shadow:0 0 18px rgba(110,231,249,.6); transition:width 1.2s var(--smooth)}
.cd{display:flex; gap:8px}
.cd div{min-width:70px; padding:10px 12px; border-radius:var(--r-s); background:rgba(255,255,255,.06); border:1px solid var(--stroke); text-align:center}
.cd b{display:block; font:700 26px/1.1 Unbounded,sans-serif; font-variant-numeric:tabular-nums}
.cd small{font-size:12.5px; font-weight:700; color:var(--ink3)}
.cd-wrap .cap{margin-bottom:8px}
.launched{font-weight:700; color:var(--good)}
.sk{border-radius:12px; background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06)); background-size:200% 100%; animation:sh 1.4s ease-in-out infinite}
@keyframes sh{from{background-position:100% 0} to{background-position:-100% 0}}
.sk.l1{height:14px; width:90px} .sk.l2{height:72px; width:170px; margin-top:10px; border-radius:18px} .sk.l3{height:16px; width:200px; margin-top:10px}
.cnt-err{display:flex; flex-direction:column; gap:12px; align-items:flex-start}
.cnt-err p{color:var(--ink2); font-weight:600}

/* форма */
.join{position:relative}
.card{padding:30px; border-radius:var(--r-xl); position:relative; z-index:2}
@media (max-width:520px){ .card{padding:22px} }
.card h2{font-size:clamp(28px,3vw,36px); line-height:1.08; font-weight:800}
.card .sub{color:var(--ink2); margin-top:10px}
.gwrap{margin-top:22px; min-height:44px; display:flex; justify-content:center}
.gwrap > div{width:100%; display:flex; justify-content:center}
.or{display:flex; align-items:center; gap:14px; margin:18px 0 4px; color:var(--ink3); font-weight:700; font-size:14px}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--stroke)}
.field{margin-top:18px}
.field label{display:block; font:700 12px Unbounded,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); margin:0 0 8px 6px}
.inp{width:100%; height:56px; padding:0 22px; border-radius:999px; border:1px solid var(--stroke2); background:rgba(255,255,255,.06); font-size:17px; font-weight:600; outline:none; transition:border-color .25s, background .25s, box-shadow .25s}
.inp::placeholder{color:rgba(174,184,214,.5)}
.inp:focus{border-color:var(--a1); background:rgba(255,255,255,.09); box-shadow:0 0 0 4px rgba(110,231,249,.18)}
.inp[aria-invalid="true"]{border-color:var(--warn)}
.consent{display:grid; grid-template-columns:26px minmax(0,1fr); gap:12px; align-items:start; margin-top:18px; font-size:14.5px; color:var(--ink2); cursor:pointer}
.consent input{appearance:none; -webkit-appearance:none; margin:0; width:26px; height:26px; border-radius:9px; border:1.5px solid var(--stroke2); background:rgba(255,255,255,.04); display:grid; place-items:center; cursor:pointer; transition:all .4s var(--spring)}
.consent input::after{content:""; width:11px; height:6px; border-left:3px solid #05070F; border-bottom:3px solid #05070F; transform:translateY(-2px) rotate(-45deg) scale(0); transition:transform .35s var(--spring)}
.consent input:checked{background:var(--grad); border-color:transparent; transform:scale(1.06)}
.consent input:checked::after{transform:translateY(-2px) rotate(-45deg) scale(1)}
.consent input:focus-visible{outline:2px solid var(--a1); outline-offset:3px}
.consent input[aria-invalid="true"]{border-color:var(--warn); box-shadow:0 0 0 4px rgba(255,107,129,.18)}
.submit{width:100%; margin-top:20px}
.err{margin-top:14px; padding:12px 16px; border-radius:var(--r-m); background:rgba(255,107,129,.12); border:1px solid rgba(255,107,129,.45); color:#FFD3DC; font-weight:700; font-size:14.5px}
.fine{margin-top:14px; font-size:13px; color:var(--ink3); text-align:center}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}

/* после записи */
.done-ico{width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--grad); box-shadow:0 0 40px -6px var(--a1); animation:pop .7s var(--spring)}
.done-ico svg{width:28px; height:28px; stroke:#05070F; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round}
@keyframes pop{from{transform:scale(.4); opacity:0}}
.done-head{display:flex; align-items:center; gap:16px; margin-bottom:18px}
.place{font:900 clamp(72px,9vw,104px)/.9 Unbounded,sans-serif; letter-spacing:-.05em; margin-top:10px}
.reflbl{margin-top:24px}
.refrow{display:flex; gap:8px; margin-top:8px}
.refrow .inp{height:52px; font-size:15px; padding:0 18px; min-width:0; flex:1; color:var(--ink2)}
.icon-btn{width:52px; height:52px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--glass2); border:1px solid var(--stroke2); transition:transform .45s var(--spring), background .25s}
.icon-btn:hover{background:rgba(255,255,255,.16)} .icon-btn:active{transform:scale(.9)}
.acts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px}
.tip{display:flex; gap:12px; padding:14px 16px; border-radius:var(--r-m); margin-top:16px; background:linear-gradient(120deg,rgba(240,168,208,.16),transparent); border:1px solid rgba(240,168,208,.4); font-weight:600; font-size:15px; color:var(--ink)}
.tip b{color:var(--a3); font-family:Unbounded; flex:none}
.linkbtn{display:block; margin:18px auto 0; color:var(--ink3); font-weight:700; font-size:14px; text-decoration:underline; text-underline-offset:3px; padding:6px 10px}
.linkbtn:hover{color:var(--ink)}
.toast{font-size:13px; font-weight:800; color:var(--good); min-height:20px; margin-top:6px; text-align:center}

/* бегущая строка */
.marq{margin-top:10px; padding:18px 0; overflow:hidden; border-block:1px solid var(--stroke); background:rgba(255,255,255,.02)}
.marq-track{display:flex; width:max-content; animation:marq 46s linear infinite}
.marq-track span{font:900 clamp(40px,5vw,64px)/1 Unbounded,sans-serif; letter-spacing:-.04em; padding-right:48px; white-space:nowrap}
.marq-track span:nth-child(odd){background:linear-gradient(100deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.marq-track span:nth-child(even){color:rgba(243,245,252,.18)}
@keyframes marq{to{transform:translateX(-50%)}}

/* секции */
.sec{padding-block:88px 0}
.sec-head{max-width:720px}
.sec-head h2{font-size:clamp(38px,5.4vw,68px); line-height:.98; font-weight:900; letter-spacing:-.045em; margin-top:10px}
.sec-head p{color:var(--ink2); font-size:18px; margin-top:14px}
.feats{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; margin-top:40px}
@media (min-width:900px){ .feats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.feat{padding:26px; border-radius:var(--r-xl); display:flex; flex-direction:column; gap:22px; overflow:hidden}
@media (max-width:520px){ .feat{padding:18px} }
.feat .lbl{display:inline-flex; gap:10px; align-items:center; font:700 12.5px Unbounded,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--a1)}
.feat .lbl::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--a1); box-shadow:0 0 12px var(--a1)}
.feat h3{font-size:clamp(26px,2.6vw,32px); line-height:1.08; margin-top:10px}
.feat p{color:var(--ink2); margin-top:10px}

/* мини-экраны */
.mock{margin-top:auto; border-radius:var(--r-l); border:1px solid var(--stroke); background:linear-gradient(160deg,rgba(20,30,64,.85),rgba(8,14,36,.92)); padding:16px; box-shadow:0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08); font-size:14px}
.mbar-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.mbar-top h4{font:800 20px/1.1 Unbounded,sans-serif; letter-spacing:-.02em}
.chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; border:1px solid var(--stroke); background:var(--glass); font-weight:700; font-size:12.5px; white-space:nowrap}
.chip .dot{width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--a1),var(--a3))}
.days{display:flex; flex-direction:column; gap:8px}
.day{display:grid; grid-template-columns:40px 58px minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 12px 8px 8px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08)}
.dname{width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font:800 13px Unbounded,sans-serif; background:rgba(255,255,255,.07); border:1px solid var(--stroke)}
.day.today .dname{background:var(--grad); color:#05070F; border-color:transparent; box-shadow:0 0 18px -4px var(--a1)}
.th{width:58px; height:58px; border-radius:16px; background-size:cover; background-position:center; flex:none}
.day h5{margin:0; font:700 15.5px/1.2 Unbounded,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.meta{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:4px; color:var(--ink3); font-weight:700; font-size:12.5px; align-items:center}
.tag{padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:800; background:rgba(110,231,249,.16); color:var(--a1)}
.tag.am{background:rgba(240,168,208,.16); color:var(--a3)}
.price{font:700 15px Unbounded,sans-serif; white-space:nowrap}
@media (max-width:460px){ .day{grid-template-columns:48px minmax(0,1fr) auto} .dname{display:none} .th{width:48px; height:48px; border-radius:14px} }

.basket{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:4px 2px 10px}
.sum{font:800 34px/1 Unbounded,sans-serif; letter-spacing:-.03em}
.basket{flex-wrap:wrap} .sum{white-space:nowrap}
@media (max-width:460px){ .mbar-top h4{font-size:17px} .sum{font-size:28px} .lane{grid-template-columns:64px minmax(0,1fr) 56px; gap:8px} }
.save{padding:5px 11px; border-radius:999px; background:rgba(94,227,161,.16); color:var(--good); font:700 12.5px Unbounded,sans-serif; white-space:nowrap}
.lane{display:grid; grid-template-columns:80px minmax(0,1fr) 72px; gap:12px; align-items:center; padding:7px 0}
.lane span{font-weight:700; color:var(--ink2); font-size:13.5px}
.track{height:10px; border-radius:10px; background:rgba(255,255,255,.07); overflow:hidden}
.track i{display:block; height:100%; width:0; border-radius:10px; background:rgba(255,255,255,.26); transition:width 1.3s var(--smooth)}
.lane.best span{color:var(--ink)}
.lane.best .track i{background:linear-gradient(90deg,var(--good),var(--a1))}
.lane b{text-align:right; font:600 14px Unbounded,sans-serif; font-variant-numeric:tabular-nums}
.in .track i{width:var(--w)}
.src{margin-top:10px; color:var(--ink3); font-size:12.5px; font-weight:600}

.rec{display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; align-items:center}
.rec .th{width:64px; height:64px}
.rec h5{margin:0; font:700 16px/1.2 Unbounded,sans-serif}
.stepnow{display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:14px; align-items:center; margin-top:14px; padding:14px; border-radius:18px; background:linear-gradient(150deg,rgba(110,231,249,.14),rgba(139,124,246,.10)); border:1px solid rgba(110,231,249,.4)}
.stepnow p{font:600 16px/1.35 Unbounded,sans-serif; margin-top:6px}
.ring{width:96px; height:96px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:8}
.ring .bgc{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#gradRing); stroke-linecap:round; transition:stroke-dashoffset 1s linear}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font:700 19px Unbounded,sans-serif; font-variant-numeric:tabular-nums}
.steps{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.steps li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; align-items:center; padding:6px 0; color:var(--ink3); font-weight:600}
.steps li b{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:600 13px Unbounded,sans-serif; background:rgba(255,255,255,.08); color:var(--ink2)}
.steps li.ok b{background:var(--good); color:#05070F}
.steps li.ok span{text-decoration:line-through; text-decoration-color:rgba(174,184,214,.4)}

.nsum{display:grid; grid-template-columns:120px minmax(0,1fr); gap:18px; align-items:center}
.ring.big{width:120px; height:120px}
.ring.big circle{stroke-width:11}
.ring.big b{display:grid; align-content:center; justify-items:center; line-height:1.05; font-size:24px; font-weight:800}
.ring.big b small{font:700 11.5px Onest,sans-serif; color:var(--ink3)}
.mrow{margin-top:8px}
.mrow:first-child{margin-top:0}
.mrow .t{display:flex; justify-content:space-between; gap:10px; font-weight:700; font-size:13px}
.mrow .t span{color:var(--ink3)}
.mrow .track{height:8px; margin-top:4px}
.mrow.p .track i{background:var(--mp)} .mrow.f .track i{background:var(--mf)} .mrow.c .track i{background:var(--mc)}
.entry{display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:12px; align-items:center; margin-top:14px; padding:8px 12px 8px 8px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08)}
.entry .th{width:48px; height:48px; border-radius:13px}
.entry h5{margin:0; font:700 15px/1.2 Unbounded,sans-serif}

/* 1 октября */
.steps4{display:grid; grid-template-columns:minmax(0,1fr); gap:16px; margin-top:40px; counter-reset:s}
@media (min-width:720px){ .steps4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1080px){ .steps4{grid-template-columns:repeat(4,minmax(0,1fr))} }
.st{padding:24px; border-radius:var(--r-l)}
.st .n{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font:800 18px Unbounded,sans-serif; background:linear-gradient(135deg,rgba(110,231,249,.3),rgba(139,124,246,.3)); border:1px solid var(--stroke2)}
.st:first-child .n{background:var(--grad); color:#05070F; border-color:transparent; box-shadow:0 0 26px -6px var(--a1)}
.st h3{font-size:21px; margin-top:18px; line-height:1.15}
.st p{color:var(--ink2); margin-top:8px; font-size:15.5px}

/* FAQ */
.faq{display:flex; flex-direction:column; gap:12px; margin-top:40px; max-width:880px}
.faq details{border-radius:var(--r-l); overflow:hidden}
.faq summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 22px; font:700 18px/1.3 Unbounded,sans-serif; border-radius:var(--r-l)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .5s var(--spring); color:var(--ink3)}
.faq details[open] summary .ico{transform:rotate(45deg); color:var(--a1)}
.faq details p{padding:0 22px 22px; color:var(--ink2); max-width:70ch}

.final{margin-top:88px; padding:36px; border-radius:var(--r-xl); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:22px}
.final h2{font-size:clamp(30px,4vw,48px); line-height:1.02; font-weight:900; letter-spacing:-.04em}
.final p{color:var(--ink2); margin-top:8px}
@media (max-width:520px){ .final{padding:24px} .final .btn{width:100%} }

footer{margin-top:70px; padding-block:34px 44px; border-top:1px solid var(--stroke)}
.foot{display:flex; flex-wrap:wrap; justify-content:space-between; gap:22px; align-items:center}
.foot nav{display:flex; flex-wrap:wrap; gap:8px 22px}
.foot nav a{color:var(--ink2); font-weight:700; text-decoration:none; padding:6px 0}
.foot nav a:hover{color:var(--ink)}
.foot small{color:var(--ink3); font-weight:600}

/* появление */
.js .rv{opacity:0; transform:translateY(26px); filter:blur(8px); transition:opacity .9s var(--smooth), transform .9s var(--smooth), filter .9s var(--smooth)}
.js .rv.in{opacity:1; transform:none; filter:none}
h1.title,.sec-head h2{animation:headIn 1s var(--ease) both}
@keyframes headIn{from{opacity:0; filter:blur(14px); transform:translateY(14px)} to{opacity:1; filter:none; transform:none}}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  .js .rv{opacity:1; transform:none}
  .marq-track{animation:none}
}
</style>

const $ = s => document.querySelector(s);

const params = new URLSearchParams(location.search);

/* ---------- отправка событий и ошибок ---------- */
function beacon(obj){

  try {
    if (navigator.sendBeacon && navigator.sendBeacon(API_URL, new Blob([body], {type:"text/plain;charset=utf-8"}))) return;
    fetch(API_URL, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=utf-8"}, body}).catch(()=>{});
  } catch {}
}
const sent = new Set();
function track(event){
  if (event !== "share" && sent.has(event)) return;
  sent.add(event);
  beacon({action:"event", event, lang, ref, path:location.pathname});
}
let errCount = 0;
function reportError(o){

}

function detectLang(){

/* ---------- счётчик ---------- */
function show(id){ ["cntLoad","cntErr","cntOk"].forEach(x => $("#" + x).hidden = x !== id); }
async function loadStats(first){
  if (first && !stats) show("cntLoad");
  try {
    const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "action=stats", {cache:"no-store", signal:AbortSignal.timeout(12000)});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (typeof d.left !== "number") throw new Error("bad stats");
    const changed = !stats || stats.left !== d.left;
    stats = {left:Math.max(0, d.left), total:d.total || TOTAL, launch:d.launch};
    show("cntOk"); $("#bar").hidden = false;
    if (changed) { renderMode(); renderCount(true); renderGoogle(); }
  } catch (e) {
    if (!stats) { show("cntErr"); $("#bar").hidden = true; }
  }
}
function renderCount(animate){
  if (!stats) return;
  const total = stats.total, left = stats.left, el = $("#leftN");
  $("#ofN").textContent = "/ " + total;
  $("#ofTxt").textContent = left > 0 ? t("ofTxt").replace("200", total) : t("ofSold");
  $("#barI").style.width = (left / total * 100) + "%";
  $("#finalH").textContent = left > 0 ? t("finalH") + left : t("finalH2");
  const from = shownLeft ?? total;
  shownLeft = left;
  if (!animate || reduced.matches || from === left) { el.textContent = left; return; }
  const t0 = performance.now(), dur = 1200;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (left - from) * e);
    if (k < 1) requestAnimationFrame(step);
    else { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  };
  requestAnimationFrame(step);
}
function tick(){
  const ms = new Date(LAUNCH_AT) - Date.now();
  const on = ms <= 0;
  $("#cd").hidden = on; $("#launched").hidden = !on;
  if (on) return;
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24, mi = m % 60;
  const set = (id, n, f) => { $("#" + id).textContent = String(n).padStart(2, "0"); $("#" + id + "l").textContent = plural(n, t(f)); };
  set("cdD", d, "day"); set("cdH", h, "hour"); set("cdM", mi, "min");
}

async function signup(extra){
  showErr(null); setBusy(true);

    const r = await fetch(API_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, signal:AbortSignal.timeout(25000),

$("#form").addEventListener("submit", e => {

/* ---------- после записи ---------- */
function refUrl(){ return location.origin + location.pathname + "?ref=" + encodeURIComponent(me.ref_code || ""); }

$("#refLink").addEventListener("focus", e => e.target.select());

/* ---------- мини-таймер и появление ---------- */
let tLeft = 240;
function timer(){
  tLeft = tLeft <= 0 ? 240 : tLeft - 1;
  $("#tNum").textContent = String(Math.floor(tLeft / 60)).padStart(2,"0") + ":" + String(tLeft % 60).padStart(2,"0");

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => {

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== lang) applyLang(h); });
applyLang(detectLang());
loadStats(true);
setInterval(tick, 20000);

<script>
/* ===== фон «Полночная кухня»: WebGL-аврора, см. src/mod_aurora.js в основном продукте.
   Фолбэк без WebGL и при reduced-motion — CSS-градиент (html.no-gl), см. правило выше. ===== */
(function(){
  const TONES = [
    [[110,231,249],[139,124,246],[240,168,208]],
    [[139,124,246],[110,231,249],[240,168,208]],
    [[240,168,208],[139,124,246],[110,231,249]],
    [[110,231,249],[94,227,161],[139,124,246]]
  ];
  const VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const FS = `precision mediump float;
uniform vec2 R;uniform float T;uniform vec2 M;uniform float G;uniform vec3 C1;uniform vec3 C2;uniform vec3 C3;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*R)/R.y;

    float fi=float(i);

    float band=exp(-y*y*10.);
    float streak=.45+.55*fbm(vec2(p.x*5.+fi*9.,y*2.5-t*2.));
    vec3 c=C1; if(i==1) c=C2; if(i==2) c=C3;

  gl_FragColor=vec4(bg+col*vig*.16,1.);

  let gl, prog, U = {}, cv, raf = 0, t0 = performance.now(), last = 0;

  function size(){
    if(!cv) return;
    const k = Math.min(1, devicePixelRatio||1) * .5;

    if(gl){ gl.viewport(0,0,cv.width,cv.height); if(!raf) frame(performance.now(), true); }
  }
  function frame(now, once){

    gl.uniform1f(U.T, rm.matches ? 40 : (now-t0)/1000);

  }

    try{ gl = cv.getContext("webgl", {antialias:false, alpha:false, powerPreference:"low-power"}); }catch(e){ gl = null; }

  }

})();

/* магнитная главная кнопка (data-magnet) и подсветка границы карточек под курсором (.spot) */

    if (rm.matches) return;
    const m = e.target.closest && e.target.closest("[data-magnet]");
    if (magEl && magEl !== m) magEl.style.transform = "";
    magEl = m;
    if (m) { const b = m.getBoundingClientRect(); m.style.transform = `translate(${((e.clientX-b.left-b.width/2)*.3).toFixed(1)}px,${((e.clientY-b.top-b.height/2)*.35).toFixed(1)}px)`; }
  }, {passive:true});
})();
